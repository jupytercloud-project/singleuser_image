name: UnauthedTest

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 12 1,15 * *" # noon on the 1st and 15th of the month
  pull_request:
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:40
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - run: ./etc/run_fedora.sh

  ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - run: ./etc/run_ubuntu.sh
